name: CI Quality Pipeline (Lab 3 & 4)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Lint, Vitest, & Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies (Clean Install)
        run: npm ci

      - name: Run ESLint Static Code Analysis
        run: npx eslint src tests

      - name: Execute Vitest Unit & Integration Tests with Coverage
        run: npx vitest run --coverage

  frontend-ci:
    name: Frontend Test & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (Clean Install)
        run: npm ci

      - name: Run ESLint Static Code Analysis
        run: npx eslint src tests

      - name: Execute Vitest API Tests with Coverage
        run: npx vitest run --coverage

      - name: Verify Vite Production Build
        run: npm run build